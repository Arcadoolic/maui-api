openapi: 3.1.0

info:
  title: MAUI-API
  version: 1.0.0-draft
  summary: Backend for MAUI arcade cabinets running in ONLINE mode.
  description: |
    Lot 1 contract: MAUI client authentication, machine binding and telemetry.
    Lot 2 (in progress): game catalog, players.
    See `docs/PLAN.md` for the design decisions behind this contract.

    ## Authentication

    Every `/api/v1` request from a MAUI cabinet sends three headers:

    | Header | Content |
    |--------|---------|
    | `X-Maui-Key` | Public client key (`mk_...`), stable across renewals. |
    | `Authorization` | `Bearer <token>`, the secret. Only one valid token per client. |
    | `X-Maui-Machine` | Machine fingerprint, see below. |

    All three are required together. A token that does not belong to the client
    carrying the key is rejected as if it were unknown.

    ## Machine fingerprint

    MAUI computes the fingerprint locally and never receives it from the API:

    `fingerprint = lowercase hex SHA-256 of (local UUID + ":" + OS machine identifier)`

    - local UUID: generated once, persisted in the MAUI config directory;
    - OS machine identifier: `/etc/machine-id` (Linux), `IOPlatformUUID` (macOS),
      `MachineGuid` (Windows). Empty string if unavailable.

    The fingerprint must be computed by the Electron main process or the BO
    Express server, never by a browser page (the BO is reachable from the LAN).

    The first authenticated request on an unbound client binds the key to the
    fingerprint. Later requests with another fingerprint get `409 machine_mismatch`.
    The binding is reset by an admin action or when a new token is claimed.

    ## Configuration string

    Credentials are delivered to the cabinet owner as a single string, pasted
    into the MAUI BO:

    `MAUI1.` + base64url(JSON), no padding. The JSON follows the
    `MauiConfiguration` schema. `MAUI1` is the version of this string format,
    unrelated to the API version.

    ## Errors

    Every error body is an RFC 9457 problem document (`application/problem+json`)
    with an extra stable `code` field. Clients must branch on `code`, never on
    `title` or `detail`.

    | Status | `code` | Meaning for MAUI |
    |--------|--------|------------------|
    | 400 | `machine_fingerprint_missing` | Client bug: header missing or malformed. |
    | 401 | `unauthenticated` | Key or token unknown, or token revoked. Fall back to LOCAL. |
    | 403 | `client_disabled` | Account disabled by an admin. Fall back to LOCAL. |
    | 403 | `insufficient_ability` | Token not allowed on this endpoint (e.g. service account). |
    | 409 | `machine_mismatch` | Credentials already bound to another cabinet. Fall back to LOCAL. |
    | 422 | `validation_failed` | Invalid body, details in `errors`. |
    | 429 | `rate_limited` | Retry after `Retry-After` seconds. |

    Players (`/players`):

    | Status | `code` | Meaning for MAUI |
    |--------|--------|------------------|
    | 403 | `pin_invalid` | Wrong PIN, `attempts_left` before the player is locked. |
    | 403 | `not_origin_cabinet` | New PIN asked (D54) or avatar sent (D56) from a cabinet the player was not created on. |
    | 404 | `avatar_not_found` | The player has no avatar (D53). |
    | 403 | `player_disabled` | Player disabled by an admin. |
    | 404 | `player_not_found` | No such initials, or a player not linked to this cabinet. |
    | 409 | `initials_taken` | Initials of another player: offer to link with the PIN. |
    | 423 | `player_locked` | Too many wrong PINs: the cabinet the player was created on, or an admin, must issue a new PIN. |
    | 500 | `server_error` | No technical detail is ever exposed. |

    Generic codes, not tied to a business rule: `forbidden` (403),
    `not_found` (404), `method_not_allowed` (405), `http_error` (any other
    4xx). Any 5xx uses `server_error`.

    ## Rate limiting

    60 requests per minute per client key (per IP when `X-Maui-Key` is
    missing), plus 600 per minute per IP. Tentative values. A heartbeat every
    60 s uses a small fraction of it. Applied before authentication.

servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker environment
  - url: https://api.maui.staging.afronob.com/api/v1
    description: Staging (online tests, D40)

tags:
  - name: Session
    description: Credentials check, machine binding and telemetry (MAUI cabinets).
  - name: Repository
    description: |
      Access to the starting-pack repository: its URL, announced by this
      server, and the check its web server runs on every file request.
  - name: Players
    description: |
      Players are global: initials unique across the fleet, linked to each
      cabinet they play on, at creation or with their 4-digit PIN. No name
      or email is ever sent. Requires the `players` ability.
  - name: Scores
    description: |
      Scores of the cabinet's players, personal bests only (D50). Requires
      the `scores:write` ability.
  - name: Leaderboards
    description: |
      Shared leaderboards (D52): the best visible score of each player.
      Requires the `scores:read` ability. Answers carry an ETag: send
      `If-None-Match` to get `304` when nothing changed.
  - name: Bots
    description: |
      The shared leaderboards for chat bots (Discord), D57. Bot accounts
      only, ability `leaderboards:read`, no machine header. Rate limit: 120
      requests per minute per key.
  - name: Catalog
    description: |
      Game catalog fed by service accounts (maui-repository's `push-catalog`).
  - name: Front
    description: |
      The hiscores front (maui-hifront), D64 to D66. Its members log in
      with Discord, on invitation, and are known by a session cookie, not by
      a token: no `X-Maui-*` header. The front's own server passes
      `/api/v1/front/*` on to this API, so the browser never calls it from
      another origin; a request that changes something must carry the
      front's `Origin` (`403 origin_not_allowed` otherwise). Rate limit: 240
      requests per minute per member, 30 per minute per IP on the login
      routes.
  - name: Invitations
    description: |
      Public web pages (HTML, not JSON) used by a cabinet owner to retrieve
      credentials. Not called by MAUI itself, documented here for completeness.

security:
  - mauiKey: []
    bearerToken: []
    mauiMachine: []

paths:
  /ping:
    get:
      tags: [Session]
      operationId: ping
      summary: Check credentials and bind the machine
      description: |
        Called by the "Test connection" button of the MAUI BO. On an unbound
        client, this call binds the key to the fingerprint (atomic: if two
        machines race, only one wins, the other gets `409 machine_mismatch`).

        Requires the `session` ability. MAUI clients only.
      responses:
        '200':
          description: Credentials valid, machine bound to this client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /startups:
    post:
      tags: [Session]
      operationId: reportStartup
      summary: Report a MAUI startup
      description: |
        Sent once when MAUI starts in ONLINE mode. Stores the versions seen on
        the cabinet and also counts as a heartbeat.

        The returned `id` is kept in memory by MAUI and attached to scores
        recorded during this run (Lot 2). If this call fails (e.g. offline
        start), MAUI simply has no startup ID for the run.

        Requires the `session` ability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartupRequest'
      responses:
        '201':
          description: Startup recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartupResponse'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /heartbeat:
    post:
      tags: [Session]
      operationId: heartbeat
      summary: Signal that the cabinet is online
      description: |
        Sent every ~60 s by a background task. Updates `last_heartbeat_at`.
        A client is shown as online when its last heartbeat is less than
        3 minutes old. No request body.

        Requires the `session` ability.
      responses:
        '204':
          description: Heartbeat recorded.
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /repository:
    get:
      tags: [Repository]
      operationId: getRepository
      summary: Get the starting-pack repository URL
      description: |
        Base URL of the repository serving the starting packs to the cabinets
        of this server (`MAUI_REPOSITORY_URL` on the server side). MAUI calls
        it before each repository action (list, install, import) and never
        asks the user for this URL: requests to the repository carry the
        cabinet credentials, which must only go to the host announced here.

        MAUI accepts an `http:` URL only when the API itself is reached over
        `http:` (local development).

        Requires the `repository:read` ability. A service account may call it
        without the machine header.
      security:
        - mauiKey: []
          bearerToken: []
          mauiMachine: []
        - mauiKey: []
          bearerToken: []
      responses:
        '200':
          description: Repository URL, or `null` when this server has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /repository/authorize:
    get:
      tags: [Repository]
      operationId: authorizeRepository
      summary: Authorize a repository request
      description: |
        Called by the repository's Caddy (`forward_auth`) on every request
        it receives, with the headers of that request: the cabinet or service
        account never calls it directly. Any response other than 2xx is sent
        back unchanged to the caller of the repository.

        Cabinets: same rules as the other routes, including the machine
        binding (an unbound cabinet gets bound here). Service accounts: no
        machine header.

        Requires the `repository:read` ability. Rate limit separate from the
        other routes and wider (1200/min per key, 2400/min per IP), since a
        pack import sends many Range requests.
      security:
        - mauiKey: []
          bearerToken: []
          mauiMachine: []
        - mauiKey: []
          bearerToken: []
      responses:
        '204':
          description: Access granted.
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /players:
    get:
      tags: [Players]
      operationId: listPlayers
      summary: List the players of this cabinet
      description: |
        Players linked to the calling cabinet, by initials, with their status:
        `active`, `disabled` (by an admin) or `locked` (too many wrong PINs).
        MAUI syncs its local players from it.
      responses:
        '200':
          description: Players linked to this cabinet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Players]
      operationId: createPlayer
      summary: Create a player
      description: |
        Reserves the initials across the fleet and links the player to this
        cabinet (D4: synchronous, no player without the API in ONLINE mode).
        The PIN is returned once, in plain text: show it to the player, never
        store it on the cabinet (admins can read it in the back office, D49).
        Players are private unless `is_public` is true. Initials made of
        one letter three times (AAA, ZZZ...) are refused with `422` (D51).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
      responses:
        '201':
          description: Player created and linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedPlayerResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlayerForbidden'
        '409':
          $ref: '#/components/responses/PlayerConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /players/availability:
    get:
      tags: [Players]
      operationId: getPlayerAvailability
      summary: Check whether initials are free
      parameters:
        - name: pseudo_3
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Pseudo3'
      responses:
        '200':
          description: '`free`, `taken` (link with the PIN) or `disabled` (taken by a disabled player).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerAvailabilityResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /players/link:
    post:
      tags: [Players]
      operationId: linkPlayer
      summary: Link an existing player with its PIN
      description: |
        Links the player owning these initials to this cabinet. Idempotent for
        a player already linked (the PIN is still checked). Each wrong PIN is
        counted; the fifth in a row locks the player (`423`) until a cabinet
        of this player issues a new PIN, or an admin unlocks it. Own rate
        limit: 10 requests per minute per key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPlayerRequest'
      responses:
        '200':
          description: Player linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '423':
          $ref: '#/components/responses/PlayerLocked'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlayerForbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    patch:
      tags: [Players]
      operationId: updatePlayer
      summary: Change the visibility of a player
      description: |
        Public players appear in the shared leaderboards; the scores of a
        private one are hidden, and shown again if it becomes public. Only for
        a player linked to this cabinet; refused for a disabled player.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlayerRequest'
      responses:
        '200':
          description: Player updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlayerForbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /players/{playerId}/pin:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    post:
      tags: [Players]
      operationId: regeneratePlayerPin
      summary: Issue a new PIN
      description: |
        Replaces the PIN and unlocks the player. Only from the cabinet the
        player was created on (`is_origin`, D54): another cabinet of the
        player gets `403 not_origin_cabinet`. Refused for a disabled player.
        The PIN is returned once.
      responses:
        '200':
          description: New PIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinResponse'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlayerForbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /players/{playerId}/link:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    delete:
      tags: [Players]
      operationId: unlinkPlayer
      summary: Unlink a player from this cabinet
      description: |
        The player keeps its initials and its other cabinets.
      responses:
        '204':
          description: Unlinked.
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlayerForbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /scores:
    post:
      tags: [Scores]
      operationId: postScores
      summary: Send a batch of scores
      description: |
        Up to 100 scores, each with its own outcome in `results`, in the
        order sent: one bad score never blocks the rest of the batch.

        - `accepted`: stored, or already stored under this `id` (a resend
          after a network cut: the `id`, generated by the cabinet, is the
          idempotency key).
        - `not_improved`: not above the player's best on this game and
          table; dropped. Only personal bests are kept.
        - `rejected`, with a `code`: `player_not_found` (not a player of
          this cabinet), `player_disabled`, `id_conflict` (this `id` is a
          score of another cabinet or player). Drop the score.

        `best` is the player's best on the game and table after this score,
        hidden scores aside: cache it, and only send what beats it. A
        `romname` outside the catalog creates a bare game. A `startup_id`
        that is not one of this cabinet's startups is ignored. Private and
        PIN-locked players' scores are accepted; private ones stay out of
        the shared leaderboards.

        The batch shape is validated as a whole (`422`, nothing written).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoresRequest'
      responses:
        '200':
          description: One result per score.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoresResponse'
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /leaderboards:
    get:
      tags: [Leaderboards]
      operationId: getLeaderboards
      summary: Leaderboards of several games
      description: |
        The leaderboards of up to 100 games, sorted by `romname`, duplicates
        removed. A game without visible scores, or unknown, has no entries.
      parameters:
        - name: romnames
          in: query
          required: true
          description: Comma-separated MAME short names, 100 at most.
          schema:
            type: string
          example: dkong,galaga
        - $ref: '#/components/parameters/ScoreTable'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: One leaderboard per game.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardListResponse'
        '304':
          description: Unchanged since the ETag sent in `If-None-Match`.
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /leaderboards/{romname}:
    parameters:
      - name: romname
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9_]{1,32}$'
    get:
      tags: [Leaderboards]
      operationId: getLeaderboard
      summary: Leaderboard of a game
      description: |
        The best visible score of each player on the game and table, best
        first (the earliest first at equal scores), top 9. Visible: not
        hidden, of a public and active player, sent by an active cabinet.
        An unknown game answers an empty leaderboard.
      parameters:
        - $ref: '#/components/parameters/ScoreTable'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The leaderboard.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '304':
          description: Unchanged since the ETag sent in `If-None-Match`.
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /players/{playerId}/bests:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    get:
      tags: [Leaderboards]
      operationId: getPlayerBests
      summary: Bests of a player
      description: |
        The visible best of a public and active player, of any cabinet, on
        each game and table, by `romname`. A private or disabled player
        answers `404 player_not_found`.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The bests.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerBestsResponse'
        '304':
          description: Unchanged since the ETag sent in `If-None-Match`.
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /players/{playerId}/avatar:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    post:
      tags: [Players]
      operationId: storePlayerAvatar
      summary: Set the avatar of a player
      description: |
        A player created on this cabinet (`is_origin`): another cabinet the
        player is linked to gets `403 not_origin_cabinet` (D56). A PNG (the
        content is checked), 256 KB and 1024 x 1024 px at most, as multipart
        field `avatar` (D53). Replaces the previous one.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar stored.
          content:
            application/json:
              schema:
                type: object
                required: [player, avatar]
                additionalProperties: false
                properties:
                  player:
                    $ref: '#/components/schemas/Player'
                  avatar:
                    type: string
                    description: SHA-256 of the PNG, as in leaderboard entries.
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Leaderboards]
      operationId: getPlayerAvatar
      summary: Avatar of a player
      description: |
        The PNG of a public and active player, of any cabinet, or of an
        active player of this cabinet, public or not (D56). The ETag is the
        SHA-256 of the PNG, as in leaderboard entries (`player.avatar`).
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The PNG.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: Unchanged since the ETag sent in `If-None-Match`.
        '400':
          $ref: '#/components/responses/MachineFingerprintMissing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`player_not_found` (private, disabled or unknown) or `avatar_not_found`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/MachineMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /catalog/games:
    put:
      tags: [Catalog]
      operationId: putCatalogGames
      summary: Upsert a batch of catalog games
      description: |
        Creates or updates up to 500 games, keyed by `romname`. Idempotent:
        sending the same batch again changes nothing. A game missing from a
        push is never deleted, since scores may reference it. Each push
        describes a game completely: a field left out is stored as `null`
        (`false` for `mature`).

        Categories are created on the fly: `genre` (genre.ini) on one level,
        `catver_genre` and `catver_subgenre` (catver.ini) as a genre and its
        child. The sender removes the `TTL *` prefix of both files and
        catver's `* Mature *` suffix, sent as `mature`.

        The batch is validated as a whole: one invalid game rejects the batch
        and nothing is written.

        Service accounts only, ability `catalog:write`, no machine header. A
        cabinet is refused with `403 insufficient_ability`. Records the
        token's `last_used_at`. Rate limit: 120 requests per minute per key.
      security:
        - mauiKey: []
          bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogGamesRequest'
      responses:
        '200':
          description: Batch applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogGamesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /bot/leaderboards:
    get:
      tags: [Bots]
      operationId: listBotLeaderboards
      summary: Leaderboards a bot can show
      description: |
        Each game and table with at least one visible score (not hidden, of
        a public and active player, sent by an active cabinet), by game
        description. What a bot offers to choose from.

        Bot accounts only, ability `leaderboards:read`. A cabinet or a
        catalog service account is refused with `403 insufficient_ability`.
        Records the token's `last_used_at`.
      security:
        - mauiKey: []
          bearerToken: []
      responses:
        '200':
          description: The available leaderboards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotLeaderboardListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /bot/leaderboards/{romname}:
    parameters:
      - name: romname
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9_]{1,32}$'
    get:
      tags: [Bots]
      operationId: getBotLeaderboard
      summary: Leaderboard of a game, for a bot
      description: |
        The same leaderboard as `GET /leaderboards/{romname}`: the best
        visible score of each player on the game and table, top 9. An
        unknown game answers an empty leaderboard. No ETag.

        Bot accounts only, ability `leaderboards:read`.
      security:
        - mauiKey: []
          bearerToken: []
      parameters:
        - $ref: '#/components/parameters/ScoreTable'
      responses:
        '200':
          description: The leaderboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /bot/events:
    get:
      tags: [Bots]
      operationId: listBotScoreEvents
      summary: Score events a bot announces
      description: |
        What the scores changed on the shared leaderboards (D60): one event
        for each stored score of a public player, with a `movement` (what the
        score did), `flavors` (what makes it remarkable, the most remarkable
        first) and a `message` already written, in English and Markdown.

        With `after`, the events whose `id` is above it, oldest first.
        Without it, the latest events, oldest first. `cursor` is the value
        to send as `after` next time. Left out: the events of scores sent
        more than 24 hours after they were made, of hidden scores, and of
        players who are no longer public and active.

        Bot accounts only, ability `events:read`.
      security:
        - mauiKey: []
          bearerToken: []
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreEventListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /front/auth/discord:
    get:
      tags: [Front]
      operationId: frontDiscordRedirect
      summary: Send the browser to the Discord login
      description: |
        A page the browser is sent to, not a call of the front. Keeps a
        `state` and the invitation in the session, then redirects to Discord
        (OAuth2 authorization code, scope `identify`). Without a Discord
        application configured on the server, redirects to the front's
        `/login?error=discord_unavailable`.
      security: []
      parameters:
        - name: invitation
          in: query
          required: false
          description: Invitation token, needed by a Discord account that is not a member yet.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to Discord, or back to the front's login page.
        '429':
          $ref: '#/components/responses/RateLimited'

  /front/auth/discord/callback:
    get:
      tags: [Front]
      operationId: frontDiscordCallback
      summary: Come back from Discord
      description: |
        Where Discord sends the browser back. Always answers a redirect to
        the front: `/` once the member is logged in, or `/login?error=<code>`:

        - `discord_denied`: the login was cancelled on Discord;
        - `discord_failed`: unknown `state`, or Discord did not answer as expected;
        - `invitation_required`: the Discord account is not a member and came without an invitation;
        - `invitation_unavailable`: the invitation does not exist, expired, was revoked or is used up;
        - `member_disabled`: the member was disabled by an admin.

        A member that comes back needs no invitation; its Discord name and
        avatar are brought up to date at each login.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by Discord when the login was cancelled.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the front.
        '429':
          $ref: '#/components/responses/RateLimited'

  /front/invitations/{memberInvitationToken}:
    parameters:
      - name: memberInvitationToken
        in: path
        required: true
        description: Token of an invitation to the front, 48 alphanumeric characters.
        schema:
          type: string
          pattern: '^[A-Za-z0-9]{48}$'
    get:
      tags: [Front]
      operationId: frontCheckInvitation
      summary: Tell whether an invitation can still be used
      description: |
        Lets the invitation page of the front tell a dead link before the
        visitor goes to Discord. Says nothing else about the invitation.
      security: []
      responses:
        '200':
          description: The invitation can be used.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [valid]
        '404':
          description: Unknown, expired, revoked or used up.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Not Found
                status: 404
                code: invitation_unavailable
        '429':
          $ref: '#/components/responses/RateLimited'

  /front/me:
    get:
      tags: [Front]
      operationId: frontMe
      summary: The logged-in member and its players
      security:
        - frontSession: []
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontMeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FrontForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /front/logout:
    post:
      tags: [Front]
      operationId: frontLogout
      summary: End the session
      security:
        - frontSession: []
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FrontForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /front/me/players:
    post:
      tags: [Front]
      operationId: frontLinkPlayer
      summary: Link a player to the member with its PIN
      description: |
        Same initials, PIN and lock as `POST /players/link` on a cabinet
        (D66): each wrong PIN is counted, the fifth in a row locks the
        player. The cabinets of the player are unchanged. A player has one
        member at most: `409 player_already_linked`, told only once the PIN
        is right. Idempotent for a player the member already linked. A member
        can link several players. Own rate limit: 10 requests per minute per
        member.
      security:
        - frontSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPlayerRequest'
      responses:
        '200':
          description: Player linked.
          content:
            application/json:
              schema:
                type: object
                required: [player]
                additionalProperties: false
                properties:
                  player:
                    $ref: '#/components/schemas/FrontPlayer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FrontForbidden'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '409':
          description: The player is linked to another member.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: player_already_linked
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          $ref: '#/components/responses/PlayerLocked'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /front/me/players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    delete:
      tags: [Front]
      operationId: frontUnlinkPlayer
      summary: Unlink a player from the member
      description: The player stays as it is on its cabinets, with its scores.
      security:
        - frontSession: []
      responses:
        '204':
          description: Player unlinked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FrontForbidden'
        '404':
          $ref: '#/components/responses/PlayerNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /invite/{invitationToken}:
    servers:
      - url: http://localhost:8080
        description: Web routes, outside the /api/v1 prefix
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [Invitations]
      operationId: showInvitation
      summary: Invitation page
      description: |
        Displays a page with a "Get my credentials" button. Does NOT consume
        the invitation, so email scanners and link previews are harmless.
      security: []
      responses:
        '200':
          description: Invitation valid, page with the claim button.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Unknown invitation.
          content:
            text/html:
              schema:
                type: string
        '410':
          description: Invitation expired or already claimed (explicit message).
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Too many requests from this IP.

  /invite/{invitationToken}/name:
    servers:
      - url: http://localhost:8080
        description: Web routes, outside the /api/v1 prefix
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [Invitations]
      operationId: drawCabinetName
      summary: Draw another cabinet name
      description: |
        "Another name" button of the invitation page. Draws a new free
        `adjective_hero` name for the cabinet and redirects back to the
        invitation page. Does not consume the invitation. Initial
        invitations only: a renewed cabinet keeps its name. CSRF protected,
        rate limited per IP with the other invitation routes.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [_token]
              properties:
                _token:
                  type: string
                  description: Laravel CSRF token from the invitation page.
      responses:
        '303':
          description: Name changed, back to the invitation page.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '403':
          description: Renewal invitation, the name cannot change.
        '404':
          description: Unknown invitation.
          content:
            text/html:
              schema:
                type: string
        '410':
          description: Invitation expired or already claimed.
          content:
            text/html:
              schema:
                type: string
        '419':
          description: CSRF token missing or expired.
        '429':
          description: Too many requests from this IP.

  /invite/{invitationToken}/claim:
    servers:
      - url: http://localhost:8080
        description: Web routes, outside the /api/v1 prefix
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [Invitations]
      operationId: claimInvitation
      summary: Claim credentials
      description: |
        Consumes the invitation in a single transaction: deletes the client's
        existing tokens, creates the new one, resets the machine binding,
        stores `claimed_at` and `claimed_ip`.

        The response page shows the configuration string once, with a "Copy"
        button and a "keep this, it will not be shown again" message.
        CSRF protected (Laravel web route), rate limited per IP (30 per
        minute, shared with the other invitation routes). A disabled client can
        claim a renewal, but stays disabled until an admin re-enables it.
        Only the latest invitation of a client is claimable.

        Response headers on both invitation routes: `Cache-Control: no-store`,
        `Referrer-Policy: no-referrer`, `X-Robots-Tag: noindex, nofollow`,
        and a nonce-based `Content-Security-Policy`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [_token]
              properties:
                _token:
                  type: string
                  description: Laravel CSRF token from the invitation page.
      responses:
        '200':
          description: Credentials issued, page with the `MAUI1.` string.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Unknown invitation.
          content:
            text/html:
              schema:
                type: string
        '410':
          description: Invitation expired or already claimed.
          content:
            text/html:
              schema:
                type: string
        '419':
          description: CSRF token missing or expired (page reloaded too late).
        '429':
          description: Too many requests from this IP.

components:
  securitySchemes:
    mauiKey:
      type: apiKey
      in: header
      name: X-Maui-Key
      description: Public client key, format `mk_` followed by 24 base62 characters.
    bearerToken:
      type: http
      scheme: bearer
      description: Sanctum token, opaque string. Never displayed twice.
    mauiMachine:
      type: apiKey
      in: header
      name: X-Maui-Machine
      description: Machine fingerprint, 64 lowercase hex characters (SHA-256).
    frontSession:
      type: apiKey
      in: cookie
      name: maui-front-session
      description: |
        Session of a member of the hiscores front, set by the Discord login
        (D64). A cookie of its own, apart from the back office's.

  parameters:
    PlayerId:
      name: playerId
      in: path
      required: true
      description: Player `id` as returned by the API (UUID).
      schema:
        type: string
        format: uuid

    InvitationToken:
      name: invitationToken
      in: path
      required: true
      description: Invitation token from the link. Stored hashed server side.
      schema:
        type: string
        minLength: 32
        maxLength: 128

    ScoreTable:
      name: table
      in: query
      required: false
      description: mhiex table.
      schema:
        type: string
        pattern: '^[a-z0-9_]{1,32}$'
        default: default

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 'ETag of the last answer: `304` if nothing changed.'
      schema:
        type: string

  headers:
    ETag:
      description: Version of the answer, for `If-None-Match`.
      schema:
        type: string

  schemas:
    MauiConfiguration:
      type: object
      description: |
        Decoded content of the `MAUI1.` configuration string. Not returned by
        any JSON endpoint, defined here as the reference for the MAUI parser.

        Parsers must ignore unknown fields: adding an optional field does not
        bump the `MAUI1` prefix. Only a breaking change does (new required
        field, different encoding, signed or encrypted payload).
      required: [url, key, token]
      properties:
        url:
          type: string
          format: uri
          description: API base URL without version prefix. MAUI appends `/api/v1`.
          examples: ['https://api.example.org']
        key:
          $ref: '#/components/schemas/ClientKey'
        token:
          type: string
          description: Sanctum token.
      examples:
        - url: https://api.example.org
          key: mk_7F3aQ9dLx2PzK8wR4mT6vYb1
          token: 12|Zx8yQ3...

    ClientKey:
      type: string
      pattern: '^mk_[A-Za-z0-9]{24}$'
      examples: ['mk_7F3aQ9dLx2PzK8wR4mT6vYb1']

    PingResponse:
      type: object
      required: [client, machine, server_time, environment]
      additionalProperties: false
      properties:
        client:
          type: object
          required: [key, name]
          additionalProperties: false
          properties:
            key:
              $ref: '#/components/schemas/ClientKey'
            name:
              type: string
              description: Human-readable cabinet name.
              examples: ['marvelous_mario']
        machine:
          type: object
          required: [bound_at, newly_bound]
          additionalProperties: false
          properties:
            bound_at:
              type: string
              format: date-time
            newly_bound:
              type: boolean
              description: True when this call created the binding.
        server_time:
          type: string
          format: date-time
          description: Lets MAUI detect a clock skew with `client_datetime`.
        environment:
          type: string
          description: |
            The server's environment (`APP_ENV`): `production`, `staging`,
            `local`. MAUI shows it next to the cabinet's name, except for
            `production` (D62).
          examples: ['staging']

    StartupRequest:
      type: object
      description: Unknown fields are ignored, so MAUI can send new ones before the API knows them.
      required: [mame_version, maui_version, os, os_version, client_datetime]
      properties:
        mame_version:
          type: string
          maxLength: 32
          description: As reported by `mame -version`.
          examples: ['0.272']
        maui_version:
          type: string
          maxLength: 32
          examples: ['2.4.0']
        os:
          type: string
          enum: [linux, darwin, win32]
          description: Node.js `process.platform`.
        os_version:
          type: string
          maxLength: 64
          description: Node.js `os.release()`, i.e. the kernel version.
          examples: ['6.8.0-139-generic']
        os_name:
          type: string
          maxLength: 64
          description: |
            Optional readable OS name: `PRETTY_NAME` of `/etc/os-release` on
            Linux, `sw_vers` on macOS, derived from the build number on
            Windows (the registry `ProductName` still says Windows 10 on
            Windows 11). Truncated to 64 characters by MAUI, omitted when it
            cannot be read. Older MAUI versions do not send it.
          examples: ['Ubuntu 24.04.5 LTS', 'macOS 15.1', 'Windows 11 (build 22631)']
        client_datetime:
          type: string
          format: date-time
          description: |
            Cabinet local time, RFC 3339 with a mandatory offset (`Z` or
            `+02:00`), optional milliseconds or microseconds. JavaScript
            `new Date().toISOString()` is accepted. Stored in UTC: the
            original offset is not kept.
          examples: ['2026-09-23T20:15:00+02:00', '2026-09-23T18:15:00.123Z']

    StartupResponse:
      type: object
      required: [id, received_at, client, environment]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Startup ID, attached to scores of this run (Lot 2).
        received_at:
          type: string
          format: date-time
        client:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              description: Human-readable cabinet name.
              examples: ['marvelous_mario']
        environment:
          type: string
          description: |
            The server's environment (`APP_ENV`): `production`, `staging`,
            `local`. MAUI shows it next to the cabinet's name, except for
            `production` (D62).
          examples: ['staging']

    RepositoryResponse:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: [string, 'null']
          format: uri
          description: Base URL without trailing slash, or `null` when this server has no repository.
          examples: ['https://repo.maui.staging.afronob.com']

    Pseudo3:
      type: string
      pattern: '^[A-Z]{3}$'
      description: Player initials, 3 uppercase letters (same rule as MAUI's Pseudo3.ts).
      examples: [ACE]

    Player:
      type: object
      required: [id, pseudo_3, is_public, status, is_origin, avatar]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        pseudo_3:
          $ref: '#/components/schemas/Pseudo3'
        is_public:
          type: boolean
        status:
          type: string
          enum: [active, disabled, locked]
          description: '`disabled` by an admin; `locked` after too many wrong PINs.'
        is_origin:
          type: boolean
          description: The player was created on this cabinet, the only one that can issue a new PIN (D54).
        avatar:
          type: [string, 'null']
          description: SHA-256 of the player's avatar (D53), null without one. Send the PNG again when the cabinet's differs.

    PlayerResponse:
      type: object
      required: [player]
      additionalProperties: false
      properties:
        player:
          $ref: '#/components/schemas/Player'

    PlayerListResponse:
      type: object
      required: [players]
      additionalProperties: false
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'

    Pin:
      type: string
      pattern: '^[0-9]{4}$'
      description: 4-digit PIN, returned once in plain text.

    CreatedPlayerResponse:
      type: object
      required: [player, pin]
      additionalProperties: false
      properties:
        player:
          $ref: '#/components/schemas/Player'
        pin:
          $ref: '#/components/schemas/Pin'

    PinResponse:
      type: object
      required: [pin]
      additionalProperties: false
      properties:
        pin:
          $ref: '#/components/schemas/Pin'

    PlayerAvailabilityResponse:
      type: object
      required: [pseudo_3, availability]
      additionalProperties: false
      properties:
        pseudo_3:
          $ref: '#/components/schemas/Pseudo3'
        availability:
          type: string
          enum: [free, taken, disabled]

    CreatePlayerRequest:
      type: object
      required: [pseudo_3]
      additionalProperties: false
      properties:
        pseudo_3:
          $ref: '#/components/schemas/Pseudo3'
        is_public:
          type: boolean
          default: false

    LinkPlayerRequest:
      type: object
      required: [pseudo_3, pin]
      additionalProperties: false
      properties:
        pseudo_3:
          $ref: '#/components/schemas/Pseudo3'
        pin:
          $ref: '#/components/schemas/Pin'

    UpdatePlayerRequest:
      type: object
      required: [is_public]
      additionalProperties: false
      properties:
        is_public:
          type: boolean

    ScoreSubmission:
      type: object
      required: [id, player_id, romname, score, achieved_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Generated by the cabinet, idempotency key. Unique within the batch.
        player_id:
          type: string
          format: uuid
          description: The player's `id` (Player), linked to this cabinet.
        romname:
          type: string
          pattern: '^[a-z0-9_]{1,32}$'
        table:
          type: string
          pattern: '^[a-z0-9_]{1,32}$'
          default: default
          description: mhiex table the score comes from.
        score:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        rank_on_cabinet:
          type: [integer, 'null']
          minimum: 1
          maximum: 999
        achieved_at:
          type: string
          format: date-time
          description: Cabinet clock; at most 5 minutes ahead of the server.
        startup_id:
          type: [string, 'null']
          format: uuid
          description: The `id` of the startup report of the run (D6), when there was one.
        attribution:
          type: string
          enum: [initials, declared]
          default: initials
          description: >-
            How the cabinet knew whose score it is (D61): `initials` read
            next to the score in the game's file, or `declared` when the
            game writes no name and the player was picked on the cabinet
            once the game was quit.

    ScoresRequest:
      type: object
      required: [scores]
      additionalProperties: false
      properties:
        scores:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ScoreSubmission'

    ScoreResult:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, not_improved, rejected]
        code:
          type: string
          enum: [player_not_found, player_disabled, id_conflict]
          description: Only when `rejected`.
        best:
          type: [integer, 'null']
          format: int64
          description: Player's best on the game and table, when not `rejected`.

    ScoresResponse:
      type: object
      required: [results]
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ScoreResult'
      example:
        results:
          - id: 0b9e2f1c-6f1d-4c4e-9a54-3d2f0e1a7b10
            status: accepted
            best: 12300
          - id: 6c1d1d0e-1b2a-4f53-8e1a-7f4a2c9d0e21
            status: not_improved
            best: 12300
          - id: 9a7e0c55-0f3c-4b8e-b0f2-2d1e6a4c8f32
            status: rejected
            code: player_not_found

    LeaderboardEntry:
      type: object
      required: [rank, player, score, achieved_at, cabinet]
      additionalProperties: false
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 9
        player:
          type: object
          required: [id, pseudo_3]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            pseudo_3:
              type: string
            avatar:
              type: [string, 'null']
              description: SHA-256 of the player's avatar (D53), null without one.
        score:
          type: integer
          format: int64
        achieved_at:
          type: string
          format: date-time
        cabinet:
          type: string
          description: Name of the cabinet the score was made on.

    Leaderboard:
      type: object
      required: [romname, table, entries]
      additionalProperties: false
      properties:
        romname:
          type: string
        table:
          type: string
        entries:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
      example:
        romname: dkong
        table: default
        entries:
          - rank: 1
            player: {id: 01a0f983-4470-72c9-be2a-81655c62a811, pseudo_3: NOB, avatar: null}
            score: 19200
            achieved_at: '2026-10-01T10:00:00+00:00'
            cabinet: supersonic_sub_zero

    LeaderboardListResponse:
      type: object
      required: [leaderboards]
      additionalProperties: false
      properties:
        leaderboards:
          type: array
          items:
            $ref: '#/components/schemas/Leaderboard'

    PlayerBestsResponse:
      type: object
      required: [player, bests]
      additionalProperties: false
      properties:
        player:
          type: object
          required: [id, pseudo_3]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            pseudo_3:
              type: string
        bests:
          type: array
          items:
            type: object
            required: [romname, table, score, achieved_at]
            additionalProperties: false
            properties:
              romname:
                type: string
              table:
                type: string
              score:
                type: integer
                format: int64
              achieved_at:
                type: string
                format: date-time

    CatalogGame:
      type: object
      required: [romname, description]
      additionalProperties: false
      properties:
        romname:
          type: string
          pattern: '^[a-z0-9_]{1,32}$'
          description: MAME short name, unique key of the game.
          examples: [dkong]
        description:
          type: string
          maxLength: 255
          examples: ['Donkey Kong (US set 1)']
        manufacturer:
          type: [string, 'null']
          maxLength: 255
          examples: ['Nintendo of America']
        year:
          type: [string, 'null']
          pattern: '^[0-9?]{4}$'
          description: MAME year, not always a number.
          examples: ['1981', '198?']
        parent_romname:
          type: [string, 'null']
          pattern: '^[a-z0-9_]{1,32}$'
          description: Parent set of a clone. Need not be catalogued.
        player_sim:
          type: [integer, 'null']
          minimum: 0
          maximum: 255
          description: Simultaneous players (Multiplayer.ini).
        player_alt:
          type: [integer, 'null']
          minimum: 0
          maximum: 255
          description: Alternating players (Multiplayer.ini).
        genre:
          type: [string, 'null']
          maxLength: 128
          description: genre.ini section.
          examples: [Platform]
        catver_genre:
          type: [string, 'null']
          maxLength: 128
          description: catver.ini genre, required with `catver_subgenre`.
          examples: [Platform]
        catver_subgenre:
          type: [string, 'null']
          maxLength: 128
          examples: ['Run Jump']
        mature:
          type: boolean
          default: false
          description: catver.ini `* Mature *` flag.

    CatalogGamesRequest:
      type: object
      required: [games]
      additionalProperties: false
      properties:
        games:
          type: array
          minItems: 1
          maxItems: 500
          description: Each `romname` at most once per batch.
          items:
            $ref: '#/components/schemas/CatalogGame'

    CatalogGamesResponse:
      type: object
      required: [received, created, updated, unchanged]
      additionalProperties: false
      properties:
        received:
          type: integer
        created:
          type: integer
        updated:
          type: integer
          description: Changed games, and games known from a score only that are now catalogued.
        unchanged:
          type: integer
      example:
        received: 500
        created: 12
        updated: 3
        unchanged: 485

    BotLeaderboardListResponse:
      type: object
      required: [leaderboards]
      additionalProperties: false
      properties:
        leaderboards:
          type: array
          items:
            type: object
            required: [romname, description, table]
            additionalProperties: false
            properties:
              romname:
                type: string
              description:
                type: string
                description: Catalog description; the romname for a game known from a score only.
              table:
                type: string
      example:
        leaderboards:
          - romname: dkong
            description: Donkey Kong (US set 1)
            table: default
          - romname: pacman
            description: Pac-Man (Midway)
            table: default

    ScoreEvent:
      type: object
      required: [id, uuid, movement, flavors, importance, message, occurred_at, player, game, table, score, rank_before, rank_after, facts]
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Grows with each event; the cursor of the readers.
        uuid:
          type: string
          format: uuid
        movement:
          type: string
          enum: [opens_board, debut_first, debut_podium, debut, reclaims_first, takes_first, extends_lead, enters_podium, climbs, improves]
        flavors:
          type: array
          description: The first one gives the message its closing line.
          items:
            type: string
            enum: [staircase, rivalry, revenge, reign_ended, photo_finish, crushing, huge_jump, leapfrog, on_a_roll, comeback, milestone, newcomer, multi_crown, collector, away_win]
        importance:
          type: integer
          minimum: 1
          maximum: 3
          description: '3: a first score, a new leader, the podium. 2: the top 9, or any flavor. 1: the rest.'
        message:
          type: string
          description: English, Markdown (`**bold**`, special characters of names escaped with a backslash).
        occurred_at:
          type: string
          format: date-time
          description: When the score was made.
        player:
          type: object
          required: [id, pseudo_3, avatar]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            pseudo_3:
              type: string
            avatar:
              type: [string, 'null']
              description: Hash of the avatar (D53).
        game:
          type: object
          required: [romname, description, manufacturer]
          additionalProperties: false
          properties:
            romname:
              type: string
            description:
              type: string
            manufacturer:
              type: [string, 'null']
        table:
          type: string
        score:
          type: integer
          format: int64
        rank_before:
          type: [integer, 'null']
          description: Null on the player's first score on the game.
        rank_after:
          type: integer
          minimum: 1
        facts:
          type: object
          description: |
            What the movement and the flavors were worked out from, for a
            reader that writes its own sentence: `previous_best`,
            `board_size`, `displaced`, `ahead` and `previous_leader`
            (`id`, `pseudo_3`, `score`, `cabinet`), `gap`, `overtaken`,
            `cabinet`, `pushed_off_podium`, `pushed_out_of_board`, `rounds`,
            `reign_days`, `streak`, `away_days`, `games`, `crowns`,
            `milestone`... Keys may be added.
          additionalProperties: true

    ScoreEventListResponse:
      type: object
      required: [events, cursor]
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ScoreEvent'
        cursor:
          type: integer
          minimum: 0
          description: Send it as `after` to read what comes next.

    FrontMember:
      type: object
      required: [id, username, display_name, avatar]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          description: Discord user name.
        display_name:
          type: [string, 'null']
          description: Discord display name, null when the account has none.
        avatar:
          type: [string, 'null']
          format: uri
          description: URL of the Discord avatar, null without one.

    FrontPlayer:
      type: object
      required: [id, pseudo_3, is_public, status, avatar]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        pseudo_3:
          $ref: '#/components/schemas/Pseudo3'
        is_public:
          type: boolean
          description: A private player is only shown to its own member.
        status:
          type: string
          enum: [active, disabled, locked]
        avatar:
          type: [string, 'null']
          description: SHA-256 of the player's avatar (D53), null without one.

    FrontMeResponse:
      type: object
      required: [member, players]
      additionalProperties: false
      properties:
        member:
          $ref: '#/components/schemas/FrontMember'
        players:
          type: array
          description: Players the member linked, by initials.
          items:
            $ref: '#/components/schemas/FrontPlayer'

    Problem:
      type: object
      description: RFC 9457 problem details, with a stable `code` extension.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        attempts_left:
          type: integer
          description: '`pin_invalid` only: wrong PINs left before the player is locked.'
        code:
          type: string
          enum:
            - machine_fingerprint_missing
            - unauthenticated
            - client_disabled
            - insufficient_ability
            - machine_mismatch
            - validation_failed
            - rate_limited
            - server_error
            - initials_taken
            - player_not_found
            - player_disabled
            - player_locked
            - pin_invalid
            - not_origin_cabinet
            - avatar_not_found
            - origin_not_allowed
            - member_disabled
            - invitation_unavailable
            - player_already_linked
            - forbidden
            - not_found
            - method_not_allowed
            - http_error

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: Field name to list of messages.
              additionalProperties:
                type: array
                items:
                  type: string

  responses:
    MachineFingerprintMissing:
      description: '`X-Maui-Machine` header missing or not 64 lowercase hex characters.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: machine_fingerprint_missing

    Unauthenticated:
      description: Key or token missing, unknown, revoked, or not matching each other.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: unauthenticated

    Forbidden:
      description: Client disabled, or token lacking the required ability.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            clientDisabled:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: client_disabled
            insufficientAbility:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: insufficient_ability

    MachineMismatch:
      description: Client already bound to another machine fingerprint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: These credentials are already used on another cabinet.
            code: machine_mismatch

    ValidationFailed:
      description: Request body invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: validation_failed
            errors:
              os:
                - The selected os is invalid.

    RateLimited:
      description: Too many requests for this client key.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: rate_limited

    PlayerForbidden:
      description: |
        Client disabled, token lacking the `players` ability, player disabled
        by an admin, wrong PIN (`attempts_left` before the lock), or a new
        PIN asked from a cabinet that is not the player's origin.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            clientDisabled:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: client_disabled
            playerDisabled:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: player_disabled
            pinInvalid:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: pin_invalid
                attempts_left: 3
            notOriginCabinet:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: not_origin_cabinet

    PlayerConflict:
      description: Initials of another player, or credentials bound to another cabinet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            initialsTaken:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: initials_taken
            machineMismatch:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: machine_mismatch

    FrontForbidden:
      description: |
        Member disabled by an admin (its session is ended), request that
        changes something without the front's `Origin`, or, when linking a
        player: player disabled, wrong PIN (`attempts_left` before the lock).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            memberDisabled:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: member_disabled
            originNotAllowed:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: origin_not_allowed
            pinInvalid:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: pin_invalid
                attempts_left: 4

    PlayerNotFound:
      description: No player with these initials, or not linked to this cabinet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: player_not_found

    PlayerLocked:
      description: Too many wrong PINs in a row.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Locked
            status: 423
            code: player_locked

    ServerError:
      description: Unexpected error. No technical detail exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            code: server_error
