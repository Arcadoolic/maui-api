name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A conflict resolution once left a marker in the docs (see PR #9).
      # "=======" alone is also a Markdown heading underline: not checked.
      - name: No conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>|\|\|\|\|\|\|\|)( |$)'; then
            echo "::error::Conflict markers are committed (lines above)."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Same extensions as the Docker image (no imagick, see D37).
          extensions: bcmath, intl, pdo_pgsql, zip, :imagick
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Known vulnerabilities fail the build; abandoned packages are only
      # reported, since they are not a vulnerability by themselves.
      - name: Composer audit
        run: composer audit --no-interaction --abandoned=report

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer analyse

  tests:
    name: Pest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maui_api_testing
          POSTGRES_USER: maui_api
          POSTGRES_PASSWORD: maui_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maui_api -d maui_api_testing"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: maui_api
      DB_PASSWORD: maui_api
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Same extensions as the Docker image (no imagick, see D37).
          extensions: bcmath, intl, pdo_pgsql, zip, :imagick
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml forces DB_CONNECTION=pgsql and DB_DATABASE=maui_api_testing.
      - name: Pest
        run: composer test
